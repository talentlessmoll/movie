<!DOCTYPE html>
<html>
<head>
    <title>Hexaro | Server Provider Test</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .btn-group { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .vidsrc { background: #ff4500; color: white; }
        .embedsu { background: #00ced1; color: black; }
        .sport7 { background: #32cd32; color: black; }
        iframe { width: 100%; height: 400px; border: 2px solid #E50914; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <h2>Test: embed.su vs vidsrc vs sport7</h2>
    <div id="results" class="grid"></div>
    <iframe id="test-player" allowfullscreen></iframe>

    <script>
        // These are the 2026 endpoints for the servers you mentioned
        const SERVERS = {
            vidsrc: "https://vidsrc.cc/v2/embed/sports/",
            embedsu: "https://embed.su/sports/live/",
            sport7: "https://sport7.pro/embed/"
        };

        async function loadMatches() {
            const today = new Date().toISOString().split('T')[0];
            const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${today}`);
            const data = await res.json();
            const container = document.getElementById('results');

            data.events.forEach(match => {
                // We create a "slug" because these servers prefer "name" over "id"
                const slug = match.strEvent.toLowerCase().replace(/ vs /g, '-vs-').replace(/ /g, '-');
                
                container.innerHTML += `
                    <div class="card">
                        <strong>${match.strEvent}</strong>
                        <div class="btn-group">
                            <button class="vidsrc" onclick="test('vidsrc', '${slug}')">VIDSRC</button>
                            <button class="embedsu" onclick="test('embedsu', '${slug}')">EMBED.SU</button>
                            <button class="sport7" onclick="test('sport7', '${slug}')">SPORT7</button>
                        </div>
                    </div>
                `;
            });
        }

        function test(server, slug) {
            const player = document.getElementById('test-player');
            player.style.display = 'block';
            // We plug the slug into the server URL
            player.src = `${SERVERS[server]}${slug}`;
            window.scrollTo(0, document.body.scrollHeight);
        }

        loadMatches();
    </script>
</body>
</html>
