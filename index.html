<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hexaro ID Fetcher Test</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; padding: 20px; }
        .match-card { 
            background: #1a1a1a; padding: 15px; margin: 10px 0; 
            border-radius: 8px; border-left: 5px solid #E50914;
            display: flex; justify-content: space-between; align-items: center;
        }
        .id-badge { background: #333; padding: 5px 10px; border-radius: 4px; font-family: monospace; color: #00ff00; }
        button { background: #E50914; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #status { color: #888; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Hexaro Auto-Fetch Tester</h2>
    <p id="status">Ready to fetch today's matches...</p>
    <button onclick="fetchTodayMatches()">FETCH LIVE IDS</button>

    <div id="results"></div>

    <script>
        async function fetchTodayMatches() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            results.innerHTML = "";
            status.innerText = "Fetching data from TheSportsDB...";

            // Get today's date in YYYY-MM-DD format
            const today = new Date().toISOString().split('T')[0];
            
            try {
                // Using the public test key '3'
                const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${today}`);
                const data = await response.json();

                if (!data.events) {
                    status.innerText = "No live events found for today.";
                    return;
                }

                status.innerText = `Found ${data.events.length} events!`;

                data.events.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div>
                            <strong>${event.strEvent}</strong><br>
                            <small>${event.strLeague}</small>
                        </div>
                        <div class="id-badge">ID: ${event.idEvent}</div>
                    `;
                    results.appendChild(card);
                    
                    // Log to console so you can see the full data structure
                    console.log("Match Data:", event);
                });

            } catch (error) {
                status.innerText = "Error: Could not connect to the API. Check your internet.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
