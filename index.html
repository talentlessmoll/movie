<!DOCTYPE html>
<html>
<body style="background: #000; color: #fff; font-family: sans-serif; text-align: center;">
    <h2>Hexaro Sports - Server Tester</h2>
    
    <div style="margin-bottom: 20px;">
        <button onclick="test('https://thedaddy.top/embed/stream-50.php')">Test DaddyLive (Sky Sports)</button>
        <button onclick="test('https://vidsrc.to/embed/sports/814392')">Test VidSrc (Live Match)</button>
    </div>

    <div id="player-container" style="width: 80%; height: 500px; margin: 0 auto; border: 2px solid red;">
        <p>Click a button to test a server...</p>
    </div>

    <script>
        function test(url) {
            const container = document.getElementById('player-container');
            container.innerHTML = `<iframe src="${url}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        }
    </script>
</body>
</html>
