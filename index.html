<!DOCTYPE html>
<html>
<head>
    <title>Hexaro Sports | 2026 Live Hub</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 250px; background: #111; padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        #player-container { flex-grow: 1; display: flex; flex-direction: column; }
        .channel-btn { 
            background: #222; padding: 15px; margin-bottom: 10px; border-radius: 8px; 
            cursor: pointer; text-align: center; border: 1px solid transparent; transition: 0.3s;
        }
        .channel-btn:hover { border-color: #E50914; background: #333; }
        iframe { width: 100%; height: 100%; border: none; }
        .header { padding: 20px; background: #000; border-bottom: 1px solid #222; font-weight: bold; color: #E50914; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3 style="margin-top: 0;">Channels</h3>
        <div class="channel-btn" onclick="play('stream-50')">Sky Sports Main</div>
        <div class="channel-btn" onclick="play('stream-33')">Sky Sports PL</div>
        <div class="channel-btn" onclick="play('stream-101')">SuperSport PL</div>
        <div class="channel-btn" onclick="play('stream-102')">SuperSport Football</div>
        <div class="channel-btn" onclick="play('stream-103')">SuperSport Variety</div>
        <div class="channel-btn" onclick="play('stream-41')">TNT Sports 1</div>
        <div class="channel-btn" onclick="play('stream-12')">beIN Sports 1</div>
    </div>

    <div id="player-container">
        <div class="header" id="now-playing">SELECT A CHANNEL TO WATCH</div>
        <iframe id="video-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        // In 2026, DaddyLive uses .php stream files. 
        // If the domain 'thedaddy.to' is blocked, change it here to 'dlhd.sx' or 'thedaddy.click'
        const BASE_URL = "https://thedaddy.to/embed/"; 

        function play(id) {
            const frame = document.getElementById('video-frame');
            document.getElementById('now-playing').innerText = "STREAMING: " + id.toUpperCase();
            frame.src = `${BASE_URL}${id}.php`;
        }
    </script>
</body>
</html>
