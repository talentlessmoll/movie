<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuki's Auto-Stream</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
        .wrapper { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        iframe { flex-grow: 1; border: none; background: #000; }
        .status-bar { background: #111; padding: 10px; font-size: 12px; color: #666; border-bottom: 1px solid #333; }
        .controls { position: absolute; bottom: 20px; right: 20px; opacity: 0.3; transition: 0.5s; }
        .controls:hover { opacity: 1; }
        button { background: #333; color: #eee; border: 1px solid #555; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="status-bar" id="status">Attempting Server 1 (Embed.su)...</div>

    <div class="wrapper">
        <iframe id="player" src="" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <button onclick="nextServer()">Skip to Next Server</button>
    </div>

    <script>
        const tmdbId = "157336"; // Interstellar
        const servers = [
            `https://embed.su/embed/movie/${tmdbId}`,
            `https://vidsrc.me/embed/${tmdbId}`,
            `https://vidsrc.xyz/embed/movie/${tmdbId}`,
            `https://www.2embed.cc/embed/${tmdbId}`
        ];

        let currentServerIndex = 0;
        const player = document.getElementById('player');
        const status = document.getElementById('status');

        function loadServer(index) {
            if (index >= servers.length) {
                status.innerText = "All servers failed. Try refreshing or using a VPN.";
                return;
            }
            status.innerText = `Trying Server ${index + 1}...`;
            player.src = servers[index];
        }

        function nextServer() {
            currentServerIndex++;
            loadServer(currentServerIndex);
        }

        // Initial Load
        loadServer(currentServerIndex);

        // Logic Note: Real "Auto-detection" of a 404 inside an iframe is blocked by 
        // browser security (CORS). The best we can do is give the user a quick 
        // "Next Server" button or use a timer to ask "Is it playing?"
    </script>
</body>
</html>
